[libdefaults]
    default_realm = HEIMDAL.TEST
    allow_weak_crypto = true

[realms]
    HEIMDAL.TEST = {
        kdc = localhost
    }

[kadmin]
    default_keys = aes256-cts-hmac-sha1-96:pw-salt aes128-cts-hmac-sha1-96:pw-salt des3-cbc-sha1:pw-salt arcfour-hmac-md5:pw-salt

[logging]
    kdc = STDERR
